<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Đồ Nội Lực - Dầm Chịu Uốn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .canvas-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 0.5rem;
            overflow-x: auto;
        }
        canvas {
            display: block;
            margin: 0 auto;
            /* Đảm bảo nét vẽ sắc nét trên màn hình độ phân giải cao */
            width: 900px;
            height: 1000px;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto mb-6">
        <h1 class="text-2xl font-bold text-gray-800 text-center">Biểu Đồ Nội Lực Dầm (Số liệu STT 1)</h1>
        <p class="text-center text-gray-600 mt-2">P = 24 kN, M = 40 kNm, q = 18 kN/m. Kích thước: a = 0.8m, b = 1.8m, c = 0.9m</p>
    </div>

    <!-- STREAMING_CHUNK:Setting up canvas... -->
    <div class="canvas-container">
        <canvas id="mechanicsCanvas" width="1800" height="2000"></canvas>
    </div>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('mechanicsCanvas');
            const ctx = canvas.getContext('2d');
            
            // Tỷ lệ cho màn hình retina (scale x2)
            ctx.scale(2, 2);

            // Cấu hình vẽ chung
            ctx.font = "16px 'Comic Sans MS', 'Arial', sans-serif";
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // --- THÔNG SỐ BÀI TOÁN ---
            const P = 24;
            const M = 40;
            const q = 18;
            const a = 0.8, b = 1.8, c = 0.9;
            const totalL = a + b + c; // 3.5
            
            // Phản lực tính toán được
            const Vb = 2.40;
            const Vc = 37.80;

            // --- THÔNG SỐ TỌA ĐỘ CANVAS ---
            const startX = 100;
            const endX = 750; // Tổng chiều dài hiển thị là 650px
            const scaleX = (endX - startX) / totalL; // pixel/mét
            
            const xA = startX;
            const xB = startX + a * scaleX;
            const xD = startX + (a + b) * scaleX;
            const xC = endX;

            const yBeam = 180;
            const yQ = 450;
            const yM = 780;

            const scaleQ = 2.5; // pixel / kN
            const scaleM = 3.5; // pixel / kNm

            /* STREAMING_CHUNK:Helper functions for drawing... */
            // Các hàm vẽ bổ trợ
            function drawLine(x1, y1, x2, y2, dash = []) {
                ctx.beginPath();
                ctx.setLineDash(dash);
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function drawArrow(x1, y1, x2, y2, headLen = 10) {
                const angle = Math.atan2(y2 - y1, x2 - x1);
                drawLine(x1, y1, x2, y2);
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
                ctx.lineTo(x2, y2);
                ctx.fillStyle = ctx.strokeStyle;
                ctx.fill();
                ctx.stroke();
            }

            function drawText(text, x, y, align="center", color="black") {
                ctx.fillStyle = color;
                ctx.textAlign = align;
                ctx.fillText(text, x, y);
            }

            function drawCircleText(text, x, y, radius=18) {
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = 'black';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x, y);
                ctx.textBaseline = 'alphabetic'; // reset
            }

            // Gióng các đường đứt nét từ trên xuống
            ctx.strokeStyle = '#ccc';
            drawLine(xA, yBeam - 80, xA, 950, [5, 5]);
            drawLine(xB, yBeam, xB, 950, [5, 5]);
            drawLine(xD, yBeam - 80, xD, 950, [5, 5]);
            drawLine(xC, yBeam, xC, 950, [5, 5]);
            ctx.strokeStyle = 'black';

            /* STREAMING_CHUNK:Drawing beam loading diagram... */
            // --- 1. VẼ SƠ ĐỒ DẦM (BEAM DIAGRAM) ---
            ctx.lineWidth = 3;
            drawLine(xA, yBeam, xC, yBeam); // Trục dầm
            ctx.lineWidth = 1.5;

            // Lực P tại A (hướng lên)
            drawArrow(xA, yBeam + 60, xA, yBeam);
            drawText("P", xA - 15, yBeam + 30);

            // Mô men M tại A
            ctx.beginPath();
            ctx.arc(xA + 20, yBeam - 20, 20, Math.PI, 0.5 * Math.PI, true);
            ctx.stroke();
            // Mũi tên của mô men (ngược chiều kim đồng hồ)
            drawArrow(xA, yBeam - 20, xA, yBeam - 15, 6);
            drawText("M", xA + 25, yBeam - 45);

            // Gối tựa B (gối di động)
            ctx.beginPath();
            ctx.arc(xB, yBeam + 8, 8, 0, Math.PI * 2);
            ctx.stroke();
            drawLine(xB - 15, yBeam + 16, xB + 15, yBeam + 16);
            for(let i=-10; i<=10; i+=5) drawLine(xB+i, yBeam+16, xB+i-5, yBeam+24);

            // Lực 2P tại D
            drawArrow(xD, yBeam - 60, xD, yBeam);
            drawText("2P", xD - 15, yBeam - 30);

            // Tải trọng phân bố q từ D đến C
            drawLine(xD, yBeam - 40, xC, yBeam - 40);
            for (let x = xD; x <= xC + 1; x += (xC - xD) / 4) {
                drawArrow(x, yBeam - 40, x, yBeam, 8);
            }
            drawText("q", (xD + xC) / 2, yBeam - 50);

            // Gối tựa C (gối cố định)
            ctx.beginPath();
            ctx.moveTo(xC, yBeam);
            ctx.lineTo(xC - 10, yBeam + 15);
            ctx.lineTo(xC + 10, yBeam + 15);
            ctx.closePath();
            ctx.stroke();
            drawLine(xC - 15, yBeam + 15, xC + 15, yBeam + 15);
            for(let i=-10; i<=10; i+=5) drawLine(xC+i, yBeam+15, xC+i-5, yBeam+23);

            // Kích thước a, b, c
            const yDim = yBeam + 60;
            drawLine(xA, yDim, xC, yDim);
            drawLine(xA, yDim-5, xA, yDim+5);
            drawLine(xB, yDim-5, xB, yDim+5);
            drawLine(xD, yDim-5, xD, yDim+5);
            drawLine(xC, yDim-5, xC, yDim+5);
            drawText("a", (xA + xB) / 2, yDim - 10);
            drawText("b", (xB + xD) / 2, yDim - 10);
            drawText("c", (xD + xC) / 2, yDim - 10);

            /* STREAMING_CHUNK:Drawing Shear Force Diagram (Qy)... */
            // --- 2. VẼ BIỂU ĐỒ LỰC CẮT (Qy) ---
            drawLine(xA - 20, yQ, xC + 20, yQ); // Trục chuẩn
            
            // Hàm tính Qy(x) với x là tọa độ mét thực tế
            function getQ(xReal) {
                if (xReal < a) return 24; // Đoạn AB
                if (xReal < a + b) return 26.40; // Đoạn BD
                return 26.40 - 48 - 18 * (xReal - a - b); // Đoạn DC
            }

            // Vẽ gạch sọc và nét bao cho biểu đồ
            ctx.beginPath();
            ctx.strokeStyle = '#4b5563'; // Màu xám đậm cho gạch sọc
            ctx.lineWidth = 1;
            for (let x = xA; x <= xC; x += 5) {
                const xReal = (x - xA) / scaleX;
                // Bỏ qua điểm kỳ dị gây lem gạch sọc
                if (Math.abs(x - xB) < 2 || Math.abs(x - xD) < 2) continue;
                const yVal = yQ - getQ(xReal) * scaleQ;
                ctx.moveTo(x, yQ);
                ctx.lineTo(x, yVal);
            }
            ctx.stroke();

            // Vẽ đường bao ngoài nét đậm
            ctx.beginPath();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.moveTo(xA, yQ);
            ctx.lineTo(xA, yQ - 24 * scaleQ);
            ctx.lineTo(xB, yQ - 24 * scaleQ);
            ctx.lineTo(xB, yQ - 26.4 * scaleQ);
            ctx.lineTo(xD, yQ - 26.4 * scaleQ);
            ctx.lineTo(xD, yQ - (-21.6) * scaleQ);
            ctx.lineTo(xC, yQ - (-37.8) * scaleQ);
            ctx.lineTo(xC, yQ);
            ctx.stroke();

            // Chú thích giá trị Qy
            ctx.fillStyle = "blue";
            drawText("24", xA + 15, yQ - 24 * scaleQ - 10);
            drawText("26.4", xB + 20, yQ - 26.4 * scaleQ - 10);
            drawText("-21.6", xD + 20, yQ - (-21.6) * scaleQ + 20);
            drawText("-37.8", xC, yQ - (-37.8) * scaleQ + 20, "right");

            // Ký hiệu dấu (+) và (-)
            drawCircleText("+", (xA + xD) / 2, yQ - 15);
            drawCircleText("-", (xD + xC) / 2, yQ + 40);

            // Label Qy
            ctx.font = "italic 24px 'Comic Sans MS', 'Arial'";
            drawCircleText("Qy", xC + 60, yQ, 25);
            ctx.font = "16px 'Comic Sans MS', 'Arial', sans-serif"; // Reset font

            /* STREAMING_CHUNK:Drawing Bending Moment Diagram (Mx)... */
            // --- 3. VẼ BIỂU ĐỒ MÔ MEN (Mx) ---
            drawLine(xA - 20, yM, xC + 20, yM); // Trục chuẩn
            
            // Hàm tính Mx(x)
            function getM(xReal) {
                if (xReal <= a) {
                    return 24 * xReal - 40; // AB
                } else if (xReal <= a + b) {
                    return 24 * xReal - 40 + 2.4 * (xReal - a); // BD
                } else {
                    return 24 * xReal - 40 + 2.4 * (xReal - a) - 48 * (xReal - a - b) - 9 * Math.pow(xReal - a - b, 2); // DC
                }
            }

            // Vẽ gạch sọc
            ctx.beginPath();
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 1;
            for (let x = xA; x <= xC; x += 5) {
                const xReal = (x - xA) / scaleX;
                const mVal = getM(xReal);
                // Biểu đồ vẽ phía thớ căng: giá trị âm vẽ lên trên, dương vẽ xuống dưới
                const yVal = yM + mVal * scaleM; 
                ctx.moveTo(x, yM);
                ctx.lineTo(x, yVal);
            }
            ctx.stroke();

            // Vẽ đường bao ngoài
            ctx.beginPath();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            
            // Đoạn thẳng AB và BD
            ctx.moveTo(xA, yM + (-40) * scaleM);
            ctx.lineTo(xB, yM + (-20.8) * scaleM);
            ctx.lineTo(xD, yM + (26.72) * scaleM);
            
            // Đoạn Parabol DC
            for (let x = xD; x <= xC; x += 2) {
                const xReal = (x - xA) / scaleX;
                const mVal = getM(xReal);
                ctx.lineTo(x, yM + mVal * scaleM);
            }
            ctx.stroke();

            // Vẽ nét nối trục tại A
            ctx.lineWidth = 1;
            drawLine(xA, yM, xA, yM + (-40) * scaleM);
            drawLine(xD, yM, xD, yM + (26.72) * scaleM); // Kẻ đường đóng tại cực trị

            // Chú thích giá trị Mx
            ctx.fillStyle = "red";
            drawText("-40", xA, yM + (-40) * scaleM - 10);
            drawText("-20.8", xB, yM + (-20.8) * scaleM - 10, "left");
            drawText("26.72", xD, yM + (26.72) * scaleM + 20);
            drawText("0", xC + 10, yM - 10, "left");

            // Ký hiệu (+) (-)
            drawCircleText("-", (xA + xB) / 2, yM - 40);
            drawCircleText("+", xD + 40, yM + 30);

            // Label Mx
            ctx.font = "italic 24px 'Comic Sans MS', 'Arial'";
            drawCircleText("Mx", xC + 60, yM, 25);
        };
    </script>
</body>
</html>
